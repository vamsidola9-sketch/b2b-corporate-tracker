<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise SaaS Dashboard</title>
    <!-- Linking our external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Sidebar Navigation -->
    <aside class="sidebar">
        <h2>CorpTrack AI</h2>
        <nav>
            <ul>
                <li class="active">📊 Overview</li>
                <li>💼 Clients</li>
                <li>✅ Tasks</li>
                <li>💰 Budgets</li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top Header Bar -->
                 <!-- Live Corporate Projects Database Table -->
        <section class="table-container">
            <h2>Active Project Inventories</h2>
            <div class="responsive-table">
                <table>
                    <thead>
                        <tr>
                            <th>Project ID</th>
                            <th>Project Name</th>
                            <th>Allocated Budget</th>
                            <th>Operational Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <!-- JavaScript will dynamically inject rows right here -->
                    <tbody id="project-table-body"></tbody>
                </table>
            </div>
        </section>

                 <!-- Interactive Corporate Input Form -->
        <section class="form-container">
            <h2>Add New Enterprise Project</h2>
            <form id="project-form">
                <div class="form-group">
                    <label for="proj-name">Project Name</label>
                    <input type="text" id="proj-name" placeholder="e.g., Data Warehouse Automation" required>
                </div>
                <div class="form-group">
                    <label for="proj-budget">Project Budget ($)</label>
                    <input type="number" id="proj-budget" placeholder="e.g., 50000" required>
                </div>
                <button type="submit" class="submit-btn">🚀 Deploy Project</button>
            </form>
        </section>

        <header class="top-header">
            <h1>Corporate Project Tracker</h1>
            <div class="user-profile">Admin User</div>
        </header>

        <!-- KPI Metrics Row (Cards) -->
        <section class="metrics-row">
            <div class="card">
                <h3>Total Budget</h3>
                <p id="total-budget">$0</p>
            </div>
            <div class="card">
                <h3>Active Tasks</h3>
                <p id="active-tasks-count">0</p>
            </div>
            <div class="card">
                <h3>Client Satisfaction</h3>
                <p>94%</p>
            </div>
        </section>
    </main>

    <!-- Linking our JavaScript file for logic -->
    <script src="app.js"></script>
</body>
</html>
